<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fieldline product film</title>
    <style>
      @font-face {
        font-family: 'Plex';
        font-weight: 400;
        src: url('../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'Plex';
        font-weight: 600;
        src: url('../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-600-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'Plex';
        font-weight: 700;
        src: url('../node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-700-normal.woff2')
          format('woff2');
      }
      @font-face {
        font-family: 'PlexMono';
        font-weight: 500;
        src: url('../node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-500-normal.woff2')
          format('woff2');
      }
      html,
      body {
        margin: 0;
        background: #111;
      }
      svg {
        display: block;
        width: 100vw;
        height: auto;
        max-height: 100vh;
        margin: 0 auto;
        font-family: 'Plex', sans-serif;
      }
      .is-render svg {
        width: 1920px;
        height: 1080px;
        max-height: none;
      }
      .mono {
        font-family: 'PlexMono', monospace;
      }
      .player {
        position: fixed;
        left: 50%;
        bottom: 12px;
        transform: translateX(-50%);
        display: flex;
        gap: 10px;
        align-items: center;
        background: rgb(0 0 0 / 70%);
        color: #fff;
        padding: 8px 12px;
        border-radius: 10px;
        font: 14px system-ui;
      }
      .player input {
        width: 360px;
      }
    </style>
  </head>
  <body>
    <svg id="stage" viewBox="0 0 1920 1080" role="img" aria-label="Fieldline product film"></svg>
    <script src="motion.js"></script>
    <script src="scene.js"></script>
  </body>
</html>
